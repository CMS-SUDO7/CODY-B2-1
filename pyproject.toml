[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-console"
version = "1.0.0"
description = "JSONL 기반의 안전한 콘솔 가계부"
requires-python = ">=3.10"

[project.scripts]
budget-app = "budget_app.cli:main"

[tool.setuptools.packages.find]
include = ["budget_app*"]
